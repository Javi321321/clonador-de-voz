# Prueba de una videollamada de verdad (WebRTC, como Meet) con una voz
# artificial de cada lado: tu voz traducida tiene que llegarle a la otra
# persona, y lo que te dice, traducido a tus auriculares (en inglés y en
# portugués, con el cambio de idioma automático). Ver portable/llamada_test.py.
# Es en Linux porque ahí se pueden armar dispositivos de audio virtuales
# (PulseAudio); en las máquinas Windows de GitHub no se puede grabar lo que
# suena en la PC.
name: Videollamada de prueba (Linux)

on:
  push:
    paths:
      - "src/**"
      - "portable/llamada_test.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/llamada-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llamada:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audio virtual (PulseAudio), pantalla virtual y PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins libportaudio2 xvfb

      - name: clonavoz (PyTorch para CPU) y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . playwright
          python -m playwright install --with-deps chromium

      - name: Descargar los modelos (como la primera vez de un usuario)
        run: clonavoz download-models --languages es en pt
        env:
          CLONAVOZ_HOME: ${{ runner.temp }}/datos

      - name: La videollamada (voces artificiales de cada lado)
        timeout-minutes: 30
        run: xvfb-run -a -s "-screen 0 1280x900x24" python portable/llamada_test.py "${{ runner.temp }}/datos" "${{ runner.temp }}/llamada"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videollamada-grabaciones
          path: ${{ runner.temp }}/llamada
          if-no-files-found: warn
