[project]
name = "clonavoz"
version = "0.1.0"
description = "Traductor de voz en vivo con clonación de tu propia voz, 100% local, para usar como micrófono virtual en cualquier videollamada."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "psutil>=5.9.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "faster-whisper>=1.0.0",
    "transformers>=4.40.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "coqui-tts>=0.24.0",
    "piper-tts>=1.2.0",
]

[project.scripts]
clonavoz = "clonavoz.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
